packages:
  - apps/*
  - packages/*

# pnpm does not run the install scripts of dependencies unless they are listed
# here. Both download a native binary when installed, and both come with
# apps/server (coming next): workerd is the local Cloudflare Workers runtime,
# and esbuild bundles the Worker. (The extension builds with Vite, which needs
# neither.)
allowBuilds:
  esbuild: true
  workerd: true
