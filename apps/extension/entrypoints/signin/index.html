<!doctype html>
<!--

  No `theme-system` class: the page around it is always light, so this is too.
  `overflow-hidden`: the frame is made as tall as the form, so it never scrolls.
-->
<html lang="en" class="overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in to GetTheDamClass</title>
  </head>
  <body class="bg-surface">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
